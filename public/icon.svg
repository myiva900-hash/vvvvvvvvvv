<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f97316" stroke-width="6" stroke-dasharray="8 12" opacity="0.3" />

  <!-- Shield Base with Shadow -->
  <path d="M 256 70 L 390 125 C 390 280 256 415 256 438 C 256 415 122 280 122 125 Z" 
        fill="url(#orangeGrad)" 
        filter="url(#shadow)" />

  <!-- Inner Shield Highlight -->
  <path d="M 256 94 L 366 140 C 366 265 256 376 256 398 C 256 376 146 265 146 140 Z" 
        fill="#ffffff" 
        opacity="0.12" />

  <!-- VPN Keyhole / Bolt / Monogram Icon -->
  <path d="M 256 160 C 220 160 190 190 190 226 C 190 248 201 267 218 278 L 202 342 L 256 322 L 310 342 L 294 278 C 311 267 322 248 322 226 C 322 190 292 160 256 160 Z M 256 206 C 267 206 276 215 276 226 C 276 237 267 246 256 246 C 245 246 236 237 236 226 C 236 215 245 206 256 206 Z" 
        fill="#ffffff" />

  <!-- Decorative Network Nodes -->
  <circle cx="160" cy="180" r="10" fill="#ffffff" opacity="0.8" />
  <circle cx="352" cy="180" r="10" fill="#ffffff" opacity="0.8" />
  <circle cx="256" cy="116" r="8" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="386" r="8" fill="#ffffff" opacity="0.9" />
</svg>
